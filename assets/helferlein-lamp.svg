<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" role="img" aria-labelledby="title">
  <title id="title">Helferlein lamp</title>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e7eef6"/>
      <stop offset="1" stop-color="#b7c6d6"/>
    </linearGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f4fcff"/>
      <stop offset="0.45" stop-color="#7ad7ff"/>
      <stop offset="1" stop-color="#1aa3d6"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#1b2430" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="220" height="280" fill="#f6f3ec"/>
  <g transform="translate(110 118)">
    <ellipse cx="0" cy="100" rx="46" ry="8" fill="#1b2430" opacity="0.12"/>
    <g filter="url(#soft)">
      <ellipse cx="0" cy="0" rx="54" ry="72" fill="url(#shell)"/>
      <ellipse cx="-16" cy="-28" rx="16" ry="22" fill="#ffffff" opacity="0.55"/>
      <rect x="-24" y="-6" width="48" height="18" rx="9" fill="#1a1e27"/>
      <ellipse cx="-10" cy="-1" rx="3.2" ry="3.2" fill="url(#eye)"/>
      <ellipse cx="10" cy="-1" rx="3.2" ry="3.2" fill="url(#eye)"/>
    </g>
  </g>
</svg>
