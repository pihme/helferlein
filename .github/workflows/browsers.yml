name: Browsers

# Cross-browser smoke test of the demo pages (landing page, demo, wardrobe): each page loads,
# the figure is visible and there are no console errors, page errors or failed requests.
# Chromium, Firefox and WebKit (Safari's engine, not real Safari) via Playwright, plus Edge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, msedge]
    steps:
      - uses: actions/checkout@v7
      # Not the Nix shell: its ldd and loader cannot see the runner's system
      # libraries, so Firefox and WebKit fail the host check even after
      # --with-deps. Node 22 matches nix/reference-env.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run build
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Smoke test
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
