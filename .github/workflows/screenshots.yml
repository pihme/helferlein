name: Screenshots

# Renders the README screenshots, the mascot, the landing page and the social preview from the
# current demo (scripts/screenshots.mjs, Chromium) and uploads them as the artifact "screenshots".
# Run it by hand from Actions -> Screenshots -> Run workflow; commit the images you want to keep.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/browsers
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run build
      - run: npx playwright install chromium
      - run: node scripts/screenshots.mjs screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
