name: Pages

# The live demo and wardrobe, built from main. It runs after CI on main has finished, release job
# included, and builds the newest main: after a release that is the release commit, so the files
# carry the released version. A push that cuts no release deploys main as it is. A failed CI run
# deploys nothing. Run it by hand from Actions -> Pages -> Run workflow.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      !github.event.repository.private && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # main, not the commit CI ran on: the release job may have pushed a release commit since
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - name: Assemble the site
        run: |
          mkdir -p _site/dist _site/src
          cp site/index.html _site/
          cp -r demo _site/demo
          cp src/roll.js src/blob.js _site/src/
          cp dist/helferlein.min.js dist/helferlein.js LICENSE THIRD_PARTY_NOTICES.md _site/dist/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
