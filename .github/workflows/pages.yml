name: Pages

# The live demo and wardrobe, built from main. GitHub Pages needs a public repository on this
# plan, so the jobs skip while the repository is private. To go live after it is public:
#   gh api -X POST repos/pihme/helferlein/pages -f build_type=workflow
# then run this workflow once (Actions -> Pages -> Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - name: Assemble the site
        run: |
          mkdir -p _site/dist _site/src
          cp site/index.html _site/
          cp -r demo _site/demo
          cp src/roll.js src/blob.js _site/src/
          cp dist/helferlein.min.js dist/helferlein.js LICENSE THIRD_PARTY_NOTICES.md _site/dist/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
